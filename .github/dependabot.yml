version: 2

# Anubandh reads documents people upload, so a compromised parser is a direct
# route to their contract. The dependency that matters most here is `unpdf`,
# which runs pdf.js over bytes a stranger chose — the single largest piece of
# untrusted input this app handles.
#
# Weekly rather than daily: this is a small project, and a pull request nobody
# reads is not a security control. Grouped so one review covers the routine
# bumps, with security updates left ungrouped so they arrive on their own and
# are obvious.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The ones that move together and break together.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Everything else routine, in one pull request.
      minor-and-patch:
        update-types: ['minor', 'patch']
    # A major bump of Next or React is a migration, not an update, and should
    # be started deliberately rather than by a bot on a Monday morning.
    ignore:
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
